<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Explorer - Interactive 3D Universe Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            position: absolute;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(10, 10, 26, 0.95);
            border-right: 1px solid rgba(100, 200, 255, 0.3);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .sidebar h1 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #87ceeb;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: rgba(50, 50, 80, 0.5);
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn.active {
            color: #87ceeb;
            border-bottom-color: #87ceeb;
            background: rgba(100, 150, 200, 0.2);
        }

        .tab-btn:hover {
            background: rgba(100, 150, 200, 0.3);
            color: #87ceeb;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .entity-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .entity-item {
            padding: 12px;
            background: rgba(50, 80, 120, 0.4);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            user-select: none;
        }

        .entity-item:hover {
            background: rgba(80, 120, 180, 0.6);
            border-color: rgba(135, 206, 235, 0.6);
            transform: translateX(4px);
        }

        .entity-item.active {
            background: rgba(135, 206, 235, 0.3);
            border-color: #87ceeb;
            color: #87ceeb;
        }

        .info-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 320px;
            max-height: 100vh;
            background: rgba(10, 10, 26, 0.95);
            border-left: 1px solid rgba(100, 200, 255, 0.3);
            padding: 20px;
            overflow-y: auto;
            z-index: 10;
            backdrop-filter: blur(10px);
            display: none;
        }

        .info-panel.active {
            display: block;
        }

        .info-panel h2 {
            color: #87ceeb;
            font-size: 16px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-panel h3 {
            color: #ffd700;
            font-size: 12px;
            margin-top: 15px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-panel p {
            font-size: 11px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 10px;
        }

        .lang-toggle {
            display: flex;
            gap: 5px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(100, 200, 255, 0.2);
        }

        .lang-btn {
            flex: 1;
            padding: 5px;
            background: rgba(50, 50, 80, 0.5);
            border: 1px solid rgba(100, 200, 255, 0.3);
            color: #aaa;
            cursor: pointer;
            font-size: 10px;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: rgba(135, 206, 235, 0.3);
            color: #87ceeb;
            border-color: #87ceeb;
        }

        .lang-btn:hover {
            background: rgba(135, 206, 235, 0.2);
        }

        .hud {
            position: absolute;
            bottom: 20px;
            left: 300px;
            right: 340px;
            background: rgba(10, 10, 26, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 4px;
            padding: 15px;
            font-size: 11px;
            color: #87ceeb;
            backdrop-filter: blur(10px);
        }

        .hud-item {
            margin: 5px 0;
            font-family: 'Courier New', monospace;
        }

        .crosshair {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 5;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(135, 206, 235, 0.4);
        }

        .crosshair-h {
            width: 8px;
            height: 1px;
            left: 6px;
            top: 10px;
        }

        .crosshair-v {
            width: 1px;
            height: 8px;
            left: 10px;
            top: 6px;
        }

        .info-text {
            display: none;
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 10, 26, 0.9);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid rgba(100, 200, 255, 0.3);
            font-size: 12px;
            max-width: 250px;
            color: #87ceeb;
            font-family: 'Courier New', monospace;
            z-index: 8;
            line-height: 1.5;
        }

        .info-text.active {
            display: block;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(50, 50, 80, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 200, 255, 0.5);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(135, 206, 235, 0.7);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="sidebar">
        <h1>⭐ Cosmos Explorer</h1>

        <div class="tabs">
            <button class="tab-btn active" data-tab="galaxies">Galaxies</button>
            <button class="tab-btn" data-tab="clusters">Clusters</button>
            <button class="tab-btn" data-tab="cosmic">Cosmic Web</button>
        </div>

        <div id="galaxies" class="tab-content active">
            <div class="entity-list" id="galaxies-list"></div>
        </div>

        <div id="clusters" class="tab-content">
            <div class="entity-list" id="clusters-list"></div>
        </div>

        <div id="cosmic" class="tab-content">
            <div class="entity-list" id="cosmic-list"></div>
        </div>
    </div>

    <div id="infoPanel" class="info-panel">
        <h2 id="infoTitle"></h2>
        <div id="infoContent"></div>
        <div class="lang-toggle">
            <button class="lang-btn active" data-lang="en">English</button>
            <button class="lang-btn" data-lang="vi">Tiếng Việt</button>
        </div>
    </div>

    <div class="hud" id="hud">
        <div class="hud-item">COSMIC EXPLORER v1.0</div>
        <div class="hud-item">Click entity to navigate</div>
        <div class="hud-item">Scroll to zoom</div>
        <div class="hud-item" id="hudCoords">Position: 0.0, 0.0, 0.0</div>
        <div class="hud-item" id="hudEntity">Current: Deep Space</div>
    </div>

    <div class="crosshair">
        <div class="crosshair-line crosshair-h"></div>
        <div class="crosshair-line crosshair-v"></div>
    </div>

    <div class="info-text" id="infoText"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== CONFIG ====================
        const CONFIG = {
            entities: [
                // GALAXIES
                {
                    id: 'spiral-mw',
                    name: 'Spiral Galaxy (Milky Way)',
                    category: 'galaxies',
                    type: 'spiral',
                    position: { x: -150, y: 50, z: 0 },
                    description: {
                        en: 'A majestic spiral galaxy with 4 grand design arms rotating slowly. Blue-white young stars populate the spiral arms, while older red stars fill the interarm regions. The bright yellow central bulge contains billions of stars.',
                        vi: 'Một thiên hà xoắn ốc hùng vĩ với 4 cánh lớn quay chậm. Những ngôi sao trẻ màu xanh-trắng nằm dọc theo cánh, trong khi những ngôi sao đỏ cũ lấp đầy vùng giữa các cánh. Cụm trung tâm sáng vàng chứa hàng tỷ ngôi sao.'
                    }
                },
                {
                    id: 'barred-spiral',
                    name: 'Barred Spiral Galaxy',
                    category: 'galaxies',
                    type: 'barredSpiral',
                    position: { x: 0, y: 100, z: 80 },
                    description: {
                        en: 'A barred spiral galaxy with a prominent central bar running through the core. Spiral arms emerge from the ends of the bar. Active star formation occurs at the bar endpoints.',
                        vi: 'Một thiên hà xoắn ốc có thanh với một cái thanh trung tâm nổi bật chạy qua lõi. Các cánh xoắn ốc xuất phát từ các đầu của thanh. Hình thành sao hoạt động xảy ra ở các điểm cuối của thanh.'
                    }
                },
                {
                    id: 'elliptical',
                    name: 'Elliptical Galaxy (Giant)',
                    category: 'galaxies',
                    type: 'elliptical',
                    position: { x: 200, y: -80, z: 120 },
                    description: {
                        en: 'A massive elliptical galaxy - among the largest in the universe. Smooth, featureless distribution of ancient yellow-orange stars. No spiral arms or dust lanes. Represents an older, quiescent system.',
                        vi: 'Một thiên hà hình elip khổng lồ - một trong những cái lớn nhất trong vũ trụ. Phân bố mịn màng, không có đặc điểm của những ngôi sao vàng-cam cổ xưa. Không có cánh xoắn ốc hay làn bụi. Đại diện cho một hệ thống cổ, tĩnh lặng.'

                    category: 'galaxies',
                    type: 'irregular',
                    position: { x: -100, y: -120, z: 60 },
                    description: {
                        en: 'A chaotic, irregular galaxy with no symmetry. Bright blue knots of active star formation scattered throughout. Pink H II regions indicate ionized hydrogen. A smaller companion galaxy is visible nearby.',
                        vi: 'Một thiên hà không đều, hỗn loạn mà không có tính đối xứng. Các điểm sáng xanh của hình thành sao hoạt động phân tán khắp. Các vùng H II hồng chỉ ra hydro ion hóa. Một thiên hà đồng hành nhỏ hơn là có thể nhìn thấy gần đó.'
                    }
                },
                {
                    id: 'ring',
                    name: 'Ring Galaxy (Hoag\'s Object)',
                    category: 'galaxies',
                    type: 'ring',
                    position: { x: 100, y: 150, z: -100 },
                    description: {
                        en: 'A rare and beautiful ring galaxy with a bright central nucleus and a gap, surrounded by a perfect ring of blue-white young stars. This unusual structure may be the result of an ancient galactic collision.',
                        vi: 'Một thiên hà hình vòng hiếm gặp và xinh đẹp với một nhân tâm sáng và một khoảng trống, được bao quanh bởi một vòng hoàn hảo của những ngôi sao trẻ màu xanh-trắng. Cấu trúc bất thường này có thể là kết quả của một vụ va chạm thiên hà cổ xưa.'
                    }

                {
                    id: 'agn',
                    name: 'Active Galaxy / Quasar',
                    category: 'galaxies',
                    type: 'agn',
                    position: { x: 250, y: 50, z: 180 },
                    description: {
                        en: 'A supermassive black hole at the center powers this active galactic nucleus. Relativistic jets shoot out perpendicular to the accretion disk at nearly the speed of light. The nucleus outshines the entire surrounding galaxy.',
                        vi: 'Một lỗ đen siêu khổng lồ ở trung tâm cung cấp năng lượng cho nhân thiên hà hoạt động này. Các tia phản tương đối tính phát ra vuông góc với đĩa quay lại gần tốc độ ánh sáng. Nhân sáng hơn toàn bộ thiên hà xung quanh.'
                    }
                },
                {
                    id: 'merging',
                    name: 'Merging Galaxies (Antennae)',
                    category: 'galaxies',
                    type: 'merging',
                    position: { x: -200, y: -50, z: 140 },
                    description: {
                        en: 'Two galaxies in collision, gravitationally torn apart. Long tidal tails stream out into space. The interface between the galaxies shows intense blue star formation. This merger will eventually create a new galaxy.',
                        vi: 'Hai thiên hà đang va chạm, bị xé rách bởi lực hấp dẫn. Những cái đuôi thủy triều dài phun ra ngoài không gian. Giao diện giữa các thiên hà cho thấy hình thành sao xanh cường độ cao. Sáp nhập này cuối cùng sẽ tạo ra một thiên hà mới.'
                    }
                },
                {
                    id: 'dwarf',
                    name: 'Dwarf Spheroidal Galaxy',
                    category: 'galaxies',
                    type: 'dwarf',
                    position: { x: 80, y: -180, z: 40 },
                    description: {
                        en: 'A small, faint dwarf spheroidal galaxy orbiting a larger galaxy. Contains only a few thousand stars. No internal structure or spiral arms. These dwarfs are thought to be the building blocks of larger galaxies.',
                        vi: 'Một thiên hà lùn hình cầu nhỏ, mờ nhạt quỹ đạo một thiên hà lớn hơn. Chứa chỉ một vài nghìn ngôi sao. Không có cấu trúc bên trong hoặc cánh xoắn ốc. Những lùn này được cho là những khối xây dựng của các thiên hà lớn hơn.'
                    }
                },
                // CLUSTERS & STRUCTURE
                {
                    id: 'open-cluster',
                    name: 'Open Star Cluster',
                    category: 'clusters',
                    type: 'openCluster',
                    position: { x: -300, y: 200, z: 0 },
                    description: {
                        en: 'A loose association of 100-200 bright, young blue-white stars. Formed recently in a stellar nursery. These clusters are dispersed over time by gravitational interactions.',
                        vi: 'Một hiệp hội lỏng lẻo của 100-200 ngôi sao trẻ sáng, xanh-trắng. Hình thành gần đây trong một phòng sinh sao. Các cụm này được phân tán theo thời gian bằng các tương tác hấp dẫn.'
                    }
                },
                {
                    id: 'globular-cluster',
                    name: 'Globular Cluster',
                    category: 'clusters',
                    type: 'globularCluster',
                    position: { x: 320, y: 150, z: -200 },
                    description: {
                        en: 'A dense spherical ball of hundreds of thousands of ancient, orange-yellow stars. Extremely tightly bound by gravity. Globulars orbit the galactic core and may be relics of the galaxy\'s formation.',
                        vi: 'Một quả cầu hình cầu dày đặc chứa hàng trăm nghìn ngôi sao cam-vàng cổ xưa. Cực kỳ chặt chẽ ràng buộc bởi lực hấp dẫn. Các globular quỹ đạo lõi thiên hà và có thể là tàn tích của sự hình thành thiên hà.'
                    }
                },
                {
                    id: 'galaxy-cluster',
                    name: 'Galaxy Cluster (Coma)',
                    category: 'clusters',
                    type: 'galaxyCluster',
                    position: { x: -400, y: -200, z: 250 },
                    description: {
                        en: 'A massive gravitationally bound system containing hundreds of galaxies. Dominated by giant elliptical galaxies. Hot intracluster plasma glows faintly in X-rays. Scale: millions of light-years across.',
                        vi: 'Một hệ thống ràng buộc hấp dẫn khổng lồ chứa hàng trăm thiên hà. Thống trị bởi các thiên hà hình elip khổng lồ. Plasma liên cụm nóng phát sáng yếu tại tia X. Quy mô: hàng triệu năm ánh sáng.'
                    }
                },
                {
                    id: 'filament',
                    name: 'Cosmic Filament',
                    category: 'cosmic',
                    type: 'filament',
                    position: { x: 0, y: 0, z: 400 },
                    description: {
                        en: 'A massive thread-like structure connecting galaxy clusters across the universe. Dark matter scaffolding (implied by the faint glow) holds galaxies together. Millions of light-years long, filaments form the skeleton of the cosmic web.',
                        vi: 'Một cấu trúc khổng lồ giống như sợi chỉ kết nối các cụm thiên hà trên toàn vũ trụ. Giàn đỡ vật chất tối (được ngụ ý bởi chúng sáng mờ) giữ các thiên hà lại với nhau. Dài hàng triệu năm ánh sáng, các sợi tạo thành bộ xương của mạng web vũ trụ.'
                    }
                },
                {
                    id: 'void',
                    name: 'Cosmic Void',
                    category: 'cosmic',
                    type: 'void',
                    position: { x: -500, y: 400, z: -300 },
                    description: {
                        en: 'A near-empty region of space bounded by cosmic filaments. Contains very few galaxies. Voids are vast expanses of seemingly empty space, perhaps holding clues to dark energy and the universe\'s expansion.',
                        vi: 'Một vùng không gian gần như trống rỗng được giới hạn bởi các sợi vũ trụ. Chứa rất ít thiên hà. Các khoảng trống là những vùng rộng lớn của không gian dường như trống rỗng, có thể giữ những manh mối về năng lượng tối và sự giãn nở của vũ trụ.'
                    }
                },
                {
                    id: 'cmb',
                    name: 'Cosmic Microwave Background',
                    category: 'cosmic',
                    type: 'cmb',
                    position: { x: 0, y: 0, z: 0 },
                    description: {
                        en: 'The most distant observable light in the universe - the afterglow of the Big Bang itself. This sphere encloses the entire observable cosmos. Temperature anisotropies reveal the seeds of galaxies in the infant universe.',
                        vi: 'Ánh sáng quan sát được xa nhất trong vũ trụ - chúng sáng còn lại của chính Big Bang. Quả cầu này bao quanh toàn bộ vũ trụ quan sát được. Sự không đẳng hướng nhiệt độ tiết lộ các hạt giống của thiên hà trong vũ trụ sơ sinh.'
                    }
                }
            ]
        };

        // ==================== SCENE SETUP ====================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;

        camera.position.set(0, 100, 250);
        camera.lookAt(0, 0, 0);

        // Deep space background
        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 5000;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 400000;
            starPositions[i + 1] = (Math.random() - 0.5) * 400000;
            starPositions[i + 2] = (Math.random() - 0.5) * 400000;

            const rand = Math.random();
            if (rand < 0.7) {
                starColors[i] = 1;
                starColors[i + 1] = 1;
                starColors[i + 2] = 1;
            } else if (rand < 0.85) {
                starColors[i] = 1;
                starColors[i + 1] = 0.8;
                starColors[i + 2] = 0.6;
            } else {
                starColors[i] = 0.6;
                starColors[i + 1] = 0.8;
                starColors[i + 2] = 1;
            }
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starsMaterial = new THREE.PointsMaterial({
            size: 40,
            vertexColors: true,
            sizeAttenuation: true
        });

        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // ==================== GALAXY GENERATORS ====================
        function createSpiralGalaxy(position) {
            const group = new THREE.Group();
            const particleCount = 25000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const armCount = 4;
            const tightness = 0.3;

            for (let i = 0; i < particleCount; i++) {
                // Mix of arm and inter-arm stars
                const inArm = Math.random() < 0.65;
                let angle = Math.random() * Math.PI * 2;
                let radius = Math.random() * 80;

                if (inArm) {
                    // Logarithmic spiral in arms
                    const armAngle = (i / particleCount) * Math.PI * 2;
                    const armIndex = Math.floor(armAngle / (Math.PI * 2 / armCount));
                    angle = armAngle + armIndex * (Math.PI * 2 / armCount) + tightness * Math.log(radius / 5);
                    radius = 20 + Math.random() * 60;
                }

                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = (Math.random() - 0.5) * 15;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                if (inArm) {
                    // Blue-white in arms
                    colors[i * 3] = 0.53;
                    colors[i * 3 + 1] = 0.81;
                    colors[i * 3 + 2] = 0.92;
                } else {
                    // Red inter-arm
                    colors[i * 3] = 1;
                    colors[i * 3 + 1] = 0.69;
                    colors[i * 3 + 2] = 0.53;
                }
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            const points = new THREE.Points(geom, mat);
            group.add(points);

            // Central bulge
            const bulgeGeom = new THREE.IcosahedronGeometry(15, 4);
            const bulgeMat = new THREE.MeshBasicMaterial({
                color: 0xffd700,
                emissive: 0xffa500,
                emissiveIntensity: 0.8
            });
            const bulge = new THREE.Mesh(bulgeGeom, bulgeMat);
            group.add(bulge);

            // Glow

        function createCMB(position) {
            const radius = 5000;
            const segments = 128;

            // Create procedural noise texture for CMB
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // CMB-like temperature map
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const nx = x / canvas.width * 4;
                    const ny = y / canvas.height * 4;

                    // Perlin-like noise
                    let val = 0;
                    let scale = 1;
                    for (let i = 0; i < 4; i++) {
                        val += Math.sin(nx * scale) * Math.cos(ny * scale) / scale;
                        scale *= 2;
                    }

                    val = (val + 2) / 4;
                    val = Math.pow(val, 1.2);

                    let r, g, b;
                    if (val < 0.4) {
                        // Cold (blue)
                        r = val * 0.25;
                        g = val * 0.4;
                        b = 0.8 + val * 0.2;
                    } else if (val < 0.6) {
                        // Medium (green-yellow)
                        r = 0.5 + val * 0.2;
                        g = 0.6 + val * 0.2;
                        b = 0.4;
                    } else {
                        // Hot (red)
                        r = 0.8 + val * 0.2;
                        g = 0.3 + val * 0.1;
                        b = val * 0.2;
                    }

                    ctx.fillStyle = `rgb(${Math.floor(r * 255)}, ${Math.floor(g * 255)}, ${Math.floor(b * 255)})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            const geom = new THREE.SphereGeometry(radius, segments, segments);
            const mat = new THREE.MeshBasicMaterial({
                map: texture,
                emissive: 0x444466,
                emissiveIntensity: 0.3,
                side: THREE.BackSide
            });

            const cmb = new THREE.Mesh(geom, mat);
            return { group: cmb, type: 'cmb', isCMB: true };

                        item.addEventListener('click', () => selectEntity(entity.id));
                        list.appendChild(item);
                    });
            });
        });

        // Initialize first tab
        tabButtons[0].click();

        function selectEntity(entityId) {
            const entity = entities[entityId];
            const mesh = entityMeshes[entityId];

            currentEntity = entity;

            // Update UI
            document.querySelectorAll('.entity-item').forEach(item => {
                item.classList.remove('active');
            });

            document.querySelectorAll('.entity-item').forEach(item => {
                if (item.textContent === entity.name) {
                    item.classList.add('active');
                }
            });

            // Show info panel
            const infoPanel = document.getElementById('infoPanel');
            infoPanel.classList.add('active');

            const titleEl = document.getElementById('infoTitle');
            const contentEl = document.getElementById('infoContent');

            titleEl.textContent = entity.name;

            const langBtns = document.querySelectorAll('.lang-btn');
            const desc = entity.description[currentLanguage];

            contentEl.innerHTML = `<h3>${currentLanguage === 'en' ? 'Overview' : 'Tổng quan'}</h3><p>${desc}</p>`;

            langBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.lang === currentLanguage) {
                    btn.classList.add('active');
                }
            });

            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentLanguage = btn.dataset.lang;
                    langBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    contentEl.innerHTML = `<h3>${currentLanguage === 'en' ? 'Overview' : 'Tổng quan'}</h3><p>${entity.description[currentLanguage]}</p>`;
                });
            });

            // Animate camera to entity
            const pos = entity.position;
            const distance = 200;
            const dir = new THREE.Vector3(pos.x, pos.y, pos.z).normalize();
            const newCameraPos = new THREE.Vector3(
                pos.x + dir.x * distance,
                pos.y + dir.y * distance + 80,
                pos.z + dir.z * distance
            );

            targetCamera = newCameraPos;
            const targetLook = new THREE.Vector3(pos.x, pos.y, pos.z);

            cameraAnimating = true;
            const startCameraPos = camera.position.clone();
            const startLookAt = new THREE.Vector3();
            camera.getWorldDirection(startLookAt);

            let cameraTime = 0;
            const cameraDuration = 1.5;

            const animateCamera = () => {
                if (!cameraAnimating) return;

                cameraTime += 0.016;
                const t = Math.min(cameraTime / cameraDuration, 1);
                const easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                camera.position.lerpVectors(startCameraPos, newCameraPos, easeT);
                camera.lookAt(targetLook);

                if (t >= 1) {
                    cameraAnimating = false;
                    camera.lookAt(targetLook);
                    return;
                }

                requestAnimationFrame(animateCamera);
            };

            animateCamera();

            // Update HUD
            document.getElementById('hudEntity').textContent = `Current: ${entity.name}`;
        }

        // ==================== ANIMATION LOOP ====================
        let rotationOffset = 0;

        function animate() {
            requestAnimationFrame(animate);

            rotationOffset += 0.0002;

            // Rotate galaxies slowly
            Object.entries(entityMeshes).forEach(([id, mesh]) => {
                const entity = entities[id];
                if (entity.type === 'spiral' || entity.type === 'barredSpiral' || entity.type === 'irregular') {
                    mesh.rotation.z += 0.00015;
                } else if (entity.type === 'merging') {
                    mesh.rotation.y += 0.0001;
                }
            });

            // Update HUD coordinates
            const coords = camera.position;
            document.getElementById('hudCoords').textContent =
                `Position: ${coords.x.toFixed(1)}, ${coords.y.toFixed(1)}, ${coords.z.toFixed(1)}`;

            renderer.render(scene, camera);
        }

        // ==================== INPUT HANDLING ====================
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            const zoomSpeed = 5;
            camera.position.addScaledVector(direction, -e.deltaY * 0.1 * zoomSpeed);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Raycaster for entity selection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if (e.target.closest('.sidebar') || e.target.closest('.info-panel')) {
                return;
            }

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const objectsToTest = Object.values(entityMeshes);
            const intersects = raycaster.intersectObjects(objectsToTest, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                for (let id in entityMeshes) {
                    if (entityMeshes[id] === clickedMesh || entityMeshes[id].children.includes(clickedMesh)) {
                        selectEntity(id);
                        return;
                    }
                }
                for (let id in entityMeshes) {
                    const mesh = entityMeshes[id];
                    if (mesh.children && mesh.children.some(child => child === clickedMesh || child.children.some(c => c === clickedMesh))) {
                        selectEntity(id);
                        return;
                    }
                }
            }
        });

        animate();
    </script>
</body>
</html>
