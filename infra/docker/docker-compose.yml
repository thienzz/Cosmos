# Cosmos Explorer — local bring-up (viz.md Phase A)
# Paths in `volumes:` and `env_file:` are relative to THIS file
# (infra/docker/), not the repo root.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cosmos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cosmos
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosmos_dev}
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    # T-E-07: connection pooler in front of Postgres. Keeps upstream
    # backend connections bounded (default_pool_size=25) while
    # presenting a 1000-slot client-facing pool to the Rust tile-server
    # under load. Configuration rationale lives in pgbouncer.ini; this
    # compose service wires the env knobs that the edoburu entrypoint
    # consumes when it generates /etc/pgbouncer/pgbouncer.ini.
    #
    # Image: edoburu/pgbouncer (community, continuously updated). We
    # previously tried bitnami/pgbouncer but Bitnami has been pruning
    # old tag variants from docker.io.
    image: edoburu/pgbouncer:latest
    container_name: cosmos-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # edoburu/pgbouncer env-var names:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: cosmos
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cosmos_dev}
      DB_NAME: cosmos
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "5"
      QUERY_WAIT_TIMEOUT: "120"
      SERVER_IDLE_TIMEOUT: "600"
      # Postgres 14+ stores passwords as SCRAM-SHA-256 verifiers by
      # default; pgbouncer must match. edoburu's entrypoint writes the
      # scram verifier it reads from $DB_PASSWORD into userlist.txt
      # at boot.
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
      ADMIN_USERS: cosmos
    healthcheck:
      # edoburu/pgbouncer listens on 5432 inside the container.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U cosmos -d cosmos || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cosmos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: cosmos-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: cosmos-api
    restart: unless-stopped
    # Host port 3010 → container 3000. 3000 is routinely held by other local
    # dev servers on this workstation (WSL-attached Vite); 3010 keeps our
    # stack conflict-free. Container port stays 3000 so inter-service URLs
    # inside the compose network are unchanged.
    ports:
      - "3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql://cosmos:cosmos_dev@postgres:5432/cosmos
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      API_PORT: 3000
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ../../data/seed:/var/cosmos/seed:ro

  tile-server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.tile-server
    container_name: cosmos-tile-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      # Talk to Postgres through pgbouncer. Host exposes pgbouncer on
      # 6432 (see ports:); container-internal, edoburu/pgbouncer listens
      # on 5432, so inside the compose network the URL is
      # pgbouncer:5432. Going direct to postgres:5432 would blow past
      # Postgres' 100-connection default the moment the Rust runtime
      # fans out under T-E-06-style load.
      DATABASE_URL: postgresql://cosmos:cosmos_dev@pgbouncer:5432/cosmos
      REDIS_URL: redis://redis:6379
      TILE_SERVER_PORT: 3001

  ephemeris:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ephemeris
    container_name: cosmos-ephemeris
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - ../../data/spice:/data/spice:ro
    environment:
      SPICE_KERNEL_DIR: /data/spice
      EPHEMERIS_PORT: 3002

volumes:
  pgdata:
