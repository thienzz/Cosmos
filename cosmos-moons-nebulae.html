<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos: Moons, Small Bodies & Nebulae</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            overflow-y: auto;
            border-right: 1px solid rgba(100, 149, 237, 0.2);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(100, 149, 237, 0.2);
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: #6495ed;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #999;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid rgba(100, 149, 237, 0.2);
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.3);
            color: #999;
            border: none;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: rgba(100, 149, 237, 0.1);
            color: #6495ed;
        }

        .tab.active {
            background: rgba(100, 149, 237, 0.2);
            color: #6495ed;
            border-bottom: 2px solid #6495ed;
        }

        .entity-list {
            padding: 10px;
        }

        .entity-item {
            padding: 12px;
            margin: 5px 0;
            background: rgba(50, 50, 80, 0.4);
            border-left: 3px solid rgba(100, 149, 237, 0.5);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .entity-item:hover {
            background: rgba(100, 149, 237, 0.3);
            border-left: 3px solid #6495ed;
            transform: translateX(5px);
        }

        .entity-item.active {
            background: rgba(100, 149, 237, 0.5);
            border-left: 3px solid #6495ed;
            color: #fff;
        }

        .entity-name {
            font-weight: 600;
            color: #6495ed;
            margin-bottom: 3px;
        }

        .entity-type {
            font-size: 11px;
            color: #888;
        }

        /* Info Panel */
        .info-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 320px;
            height: 100vh;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            overflow-y: auto;
            border-left: 1px solid rgba(100, 149, 237, 0.2);
            padding: 20px;
        }

        .info-panel h2 {
            color: #6495ed;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 1px solid rgba(100, 149, 237, 0.3);
            padding-bottom: 10px;
        }

        .info-content {
            font-size: 13px;
            line-height: 1.6;
        }

        .info-section {
            margin-bottom: 15px;
        }

        .info-label {
            color: #6495ed;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .info-text {
            color: #ccc;
            font-size: 12px;
        }

        .divider {
            border-top: 1px solid rgba(100, 149, 237, 0.2);
            margin: 12px 0;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 300px;
            background: rgba(10, 10, 26, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(100, 149, 237, 0.3);
            font-size: 12px;
            color: #999;
            z-index: 50;
            max-width: 400px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 8px 12px;
            background: rgba(100, 149, 237, 0.2);
            color: #6495ed;
            border: 1px solid rgba(100, 149, 237, 0.5);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(100, 149, 237, 0.4);
            border-color: #6495ed;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6495ed;
            font-size: 16px;
            z-index: 200;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(100, 149, 237, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(100, 149, 237, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 149, 237, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>COSMOS</h1>
            <p>Moons • Small Bodies • Nebulae</p>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="moons">Moons</button>
            <button class="tab" data-tab="small-bodies">Small Bodies</button>
            <button class="tab" data-tab="nebulae">Nebulae</button>
        </div>
        <div id="entity-list" class="entity-list"></div>
    </div>

    <div class="info-panel">
        <h2 id="info-title">Select an entity</h2>
        <div id="info-content" class="info-content">
            <p style="color: #888;">Click on any entity in the sidebar to explore it in detail.</p>
        </div>
    </div>

    <div class="controls">
        <div>
            <strong style="color: #6495ed;">Controls:</strong><br>
            Mouse: Orbit | Wheel: Zoom | Click: Select
        </div>
        <div class="btn-group">
            <button onclick="resetCamera()">Reset View</button>
            <button onclick="toggleAutoRotate()">Auto Rotate</button>
        </div>
    </div>

    <div class="loading" id="loading">Initializing...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================================
        // SCENE SETUP
        // ============================================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 0, 80);
        camera.lookAt(0, 0, 0);

        // ============================================================
        // LIGHTS & ENVIRONMENT
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(100, 100, 50);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // Starfield
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 5000;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 2000;
            starPositions[i + 1] = (Math.random() - 0.5) * 2000;
            starPositions[i + 2] = (Math.random() - 0.5) * 2000;

            const brightness = Math.random() * 0.5 + 0.5;
            starColors[i] = brightness;
            starColors[i + 1] = brightness;
            starColors[i + 2] = brightness;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starMaterial = new THREE.PointsMaterial({
            size: 0.5,
            vertexColors: true,
            sizeAttenuation: true
        });

        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // ============================================================
        // SHADERS
        // ============================================================
        const noiseFragment = `
            float hash(vec3 p) {
                return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
            }

            float noise(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);

                float n000 = hash(i);
                float n100 = hash(i + vec3(1, 0, 0));
                float n010 = hash(i + vec3(0, 1, 0));
                float n110 = hash(i + vec3(1, 1, 0));
                float n001 = hash(i + vec3(0, 0, 1));
                float n101 = hash(i + vec3(1, 0, 1));
                float n011 = hash(i + vec3(0, 1, 1));
                float n111 = hash(i + vec3(1, 1, 1));

                float nx0 = mix(n000, n100, f.x);
                float nx1 = mix(n010, n110, f.x);
                float nxy0 = mix(nx0, nx1, f.y);

                float nx0b = mix(n001, n101, f.x);
                float nx1b = mix(n011, n111, f.x);
                float nxy1 = mix(nx0b, nx1b, f.y);

                return mix(nxy0, nxy1, f.z);
            }

            float fbm(vec3 p) {
                float value = 0.0;
                float amp = 1.0;
                for(int i = 0; i < 4; i++) {
                    value += amp * noise(p);
                    p *= 2.0;
                    amp *= 0.5;
                }
                return value;
            }
        `;

        // Volcanic Moon Shader (Io)
        const volcanicMoonFragment = noiseFragment + `
            uniform float uTime;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 pos = normalize(vPosition);

                // Base sulfur color
                float pattern = fbm(pos * 5.0 + uTime * 0.1);
                float craters = fbm(pos * 8.0);

                vec3 color = mix(vec3(1.0, 0.84, 0.0), vec3(1.0, 0.55, 0.0), pattern * 0.5);
                color = mix(color, vec3(0.86, 0.08, 0.24), craters * 0.3);

                // Lava glow
                float lava = sin(pos.x * 10.0 + uTime) * cos(pos.y * 10.0 + uTime) * 0.5 + 0.5;
                if(lava > 0.7) {
                    color += vec3(1.0, 0.2, 0.0) * (lava - 0.7) * 2.0;
                }

                // Lighting
                float light = dot(normal, normalize(vec3(1, 1, 0))) * 0.5 + 0.5;
                gl_FragColor = vec4(color * light, 1.0);
            }
        `;

        // Icy Moon Shader (Europa)
        const icyMoonFragment = noiseFragment + `
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 pos = normalize(vPosition);

                // Ice base
                vec3 color = vec3(0.96, 0.96, 0.84);

                // Cracks (lineae)
                float cracks = fbm(pos * 10.0);
                cracks = smoothstep(0.4, 0.6, cracks);
                color = mix(color, vec3(0.55, 0.45, 0.33), cracks * 0.6);

                // Salt deposits in cracks
                float salt = fbm(pos * 20.0);
                if(cracks > 0.5) {
                    color += vec3(1.0, 0.6, 0.2) * salt * 0.3;
                }

                // Blue ice tint
                color *= vec3(0.95, 0.98, 1.0);

                // Lighting
                float light = dot(normal, normalize(vec3(1, 1, 0))) * 0.5 + 0.5;
                gl_FragColor = vec4(color * light, 1.0);
            }
        `;

        // Atmospheric Moon Shader (Titan)
        const atmosphericMoonFragment = noiseFragment + `
            uniform float uTime;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 pos = normalize(vPosition);

                // Thick atmosphere
                vec3 color = vec3(1.0, 0.55, 0.0);

                // Haze layers
                float haze = fbm(pos * 3.0 + uTime * 0.05);
                haze += fbm(pos * 6.0 - uTime * 0.1) * 0.5;
                color = mix(color, vec3(0.8, 0.4, 0.0), haze * 0.4);

                // Lighting
                float light = dot(normal, normalize(vec3(1, 1, 0))) * 0.5 + 0.5;
                gl_FragColor = vec4(color * light, 1.0);
            }
        `;

        // Rocky Moon Shader (Luna)
        const rockyMoonFragment = noiseFragment + `
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 pos = normalize(vPosition);

                // Cratered surface
                float craters = fbm(pos * 15.0);
                float highlands = fbm(pos * 8.0);

                vec3 mare = vec3(0.29, 0.29, 0.29);
                vec3 highland = vec3(0.75, 0.75, 0.75);

                vec3 color = mix(mare, highland, craters * 0.7 + highlands * 0.3);

                // Crater rims
                float rims = smoothstep(0.4, 0.6, craters);
                color += vec3(0.3) * rims * 0.2;

                // Lighting
                float light = dot(normal, normalize(vec3(1, 1, 0))) * 0.5 + 0.5;
                gl_FragColor = vec4(color * light, 1.0);
            }
        `;

        // Basic material for irregular bodies
        const irregularMoonFragment = `
            varying vec3 vNormal;

            void main() {
                vec3 normal = normalize(vNormal);
                float light = dot(normal, normalize(vec3(1, 1, 0))) * 0.5 + 0.5;
                vec3 color = vec3(0.24, 0.24, 0.24) * light;
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // Nebula volumetric shader
        const nebulaDensityFragment = noiseFragment + `
            uniform float uTime;
            varying vec3 vPosition;
            varying vec3 vNormal;

            void main() {
                vec3 pos = vPosition * 0.01;
                float density = fbm(pos + uTime * 0.02);
                density += fbm(pos * 2.0 - uTime * 0.03) * 0.5;
                density = smoothstep(0.3, 0.8, density);

                vec3 color = vec3(1.0, 0.2, 0.3) * density * 0.8;
                gl_FragColor = vec4(color, density);
            }
        `;

        // Create shader materials
        function createShaderMaterial(fragmentShader, uniforms = {}) {
            return new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    ...uniforms
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: fragmentShader,
                side: THREE.DoubleSide
            });
        }

        // ============================================================
        // CELESTIAL BODIES DATA
        // ============================================================
        const entities = {
            moons: [
                {
                    name: 'Io',
                    type: 'Volcanic Moon',
                    id: 'io',
                    radius: 8,
                    position: [0, 0, 0],
                    color: 0xFFD700,
                    shader: volcanicMoonFragment,
                    info: {
                        en: 'A volcanic moon with active sulfur eruptions. The surface is constantly reshaped by intense tidal heating from its primary.',
                        vi: 'Mặt trăng chủ động bằng giai dựa trên hoạt động núi lửa. Bề mặt được định hình lại liên tục bởi sự gia nhiệt triều của vật chủ.'
                    }
                },
                {
                    name: 'Europa',
                    type: 'Icy Ocean Moon',
                    id: 'europa',
                    radius: 7,
                    position: [0, 0, 0],
                    color: 0xF5F5DC,
                    shader: icyMoonFragment,
                    info: {
                        en: 'Covered in cracked ice with a subsurface ocean. Cryovolcanic plumes shoot water vapor upward from beneath the icy crust.',
                        vi: 'Được bao phủ bởi tấm băng nứt với đại dương bên dưới. Các vụ phun cryovolcanic phun ra hơi nước từ dưới lớp vỏ đông.'
                    }
                },
                {
                    name: 'Titan',
                    type: 'Atmospheric Moon',
                    id: 'titan',
                    radius: 9,
                    position: [0, 0, 0],
                    color: 0xFF8C00,
                    shader: atmosphericMoonFragment,
                    info: {
                        en: 'A thick atmosphere obscures the surface. Methane rain and liquid hydrocarbon seas characterize this mysterious world.',
                        vi: 'Một bầu khí quyển dày che phủ bề mặt. Mưa methane và biển hydrocarbide lỏng đặc trưng cho thế giới bí ẩn này.'
                    }
                },
                {
                    name: 'The Moon',
                    type: 'Rocky Moon',
                    id: 'luna',
                    radius: 7,
                    position: [0, 0, 0],
                    color: 0xC0C0C0,
                    shader: rockyMoonFragment,
                    info: {
                        en: 'Cratered and airless. Mare basins and highland regions show billions of years of bombardment and geological history.',
                        vi: 'Có hình sư và không có bầu khí quyển. Các chứng chỉ basins và vùng cao nguyên cho thấy hàng tỷ năm bắn phá và lịch sử địa chất.'
                    }
                },
                {
                    name: 'Phobos',
                    type: 'Irregular Captured Moon',
                    id: 'phobos',
                    radius: 4,
                    position: [0, 0, 0],
                    color: 0x3C3C3C,
                    shader: irregularMoonFragment,
                    info: {
                        en: 'Highly irregular and heavily cratered. Grooves and striations cover this captured asteroid, with Stickney crater being the largest feature.',
                        vi: 'Hình dạng không đều và được rạp đầy hố. Các rãnh và vết nứt bao phủ tiểu hành tinh bị bắt này.'
                    }
                }
            ],
            smallBodies: [
                {
                    name: 'Bennu',
                    type: 'C-Type Asteroid',
                    id: 'bennu',
                    radius: 3,
                    position: [0, 0, 0],
                    color: 0x3C3C3C,
                    shader: irregularMoonFragment,
                    info: {
                        en: 'A carbonaceous asteroid with a dark, porous surface. Rotating slowly, it tumbles through space.',
                        vi: 'Một tiểu hành tinh chứa cacbon với bề mặt tối và xốp. Nó quay chậm trong vũ trụ.'
                    }
                },
                {
                    name: 'Halley\'s Comet',
                    type: 'Active Comet',
                    id: 'halley',
                    radius: 5,
                    position: [0, 0, 0],
                    color: 0x1C1C1C,
                    shader: irregularMoonFragment,
                    info: {
                        en: 'A short-period comet with a spectacular tail. As it approaches the sun, gas and dust create the iconic coma and tails.',
                        vi: 'Một sao chổi chu kỳ ngắn với đuôi ngoạn mục. Khi nó tiến tới mặt trời, khí và bụi tạo ra coma và đuôi nổi tiếng.'
                    }
                },
                {
                    name: 'Pluto',
                    type: 'Dwarf Planet',
                    id: 'pluto',
                    radius: 4,
                    position: [0, 0, 0],
                    color: 0xDEB887,
                    shader: rockyMoonFragment,
                    info: {
                        en: 'A distant dwarf planet with nitrogen ice and the famous heart-shaped Tombaugh Regio. Has its own moon system.',
                        vi: 'Một hành tinh lùn ở xa với băng nitơ và khu vực Tombaugh hình trái tim nổi tiếng. Có hệ thống mặt trăng riêng.'
                    }
                },
                {
                    name: '\'Oumuamua',
                    type: 'Interstellar Object',
                    id: 'oumuamua',
                    radius: 2,
                    position: [0, 0, 0],
                    color: 0x4A2020,
                    shader: irregularMoonFragment,
                    info: {
                        en: 'An unusual elongated visitor from another star system. Its cigar-shaped form and rapid motion puzzle astronomers.',
                        vi: 'Một khách lạ kéo dài lạ thường từ một hệ sao khác. Hình dáng như xì gà của nó làm các nhà thiên văn bối rối.'
                    }
                }
            ],
            nebulae: [
                {
                    name: 'Orion Nebula',
                    type: 'Emission Nebula',
                    id: 'orion',
                    radius: 25,
                    position: [0, 0, 0],
                    color: 0xFF4444,
                    shader: nebulaDensityFragment,
                    info: {
                        en: 'A stellar nursery where new stars are born. The ionized hydrogen glows red, while oxygen and sulfur provide blue and red hues.',
                        vi: 'Một nhà máy sao nơi những ngôi sao mới được sinh ra. Hidro ion phát sáng đỏ, trong khi oxy và lưu huỳnh cung cấp các sắc thái xanh và đỏ.'
                    }
                },
                {
                    name: 'Ring Nebula',
                    type: 'Planetary Nebula',
                    id: 'ring',
                    radius: 15,
                    position: [0, 0, 0],
                    color: 0x00FF7F,
                    shader: nebulaDensityFragment,
                    info: {
                        en: 'The ejected atmosphere of a dying star, expanding in concentric shells. A white dwarf marks the center.',
                        vi: 'Bầu khí quyển được phun ra của một ngôi sao đang chết, mở rộng trong các vỏ đồng tâm. Một lùn trắng đánh dấu trung tâm.'
                    }
                },
                {
                    name: 'Horsehead Nebula',
                    type: 'Dark Nebula',
                    id: 'horsehead',
                    radius: 20,
                    position: [0, 0, 0],
                    color: 0x2F2F2F,
                    shader: irregularMoonFragment,
                    info: {
                        en: 'A dense cloud of gas and dust that blocks background light. The distinctive horse head shape emerges from the darkness.',
                        vi: 'Một đám mây dày đặc của khí và bụi chặn ánh sáng nền. Hình dáng đầu ngựa đặc biệt nổi lên từ bóng tối.'
                    }
                },
                {
                    name: 'Crab Nebula',
                    type: 'Supernova Remnant',
                    id: 'crab',
                    radius: 18,
                    position: [0, 0, 0],
                    color: 0x6495ED,
                    shader: nebulaDensityFragment,
                    info: {
                        en: 'The expanding remnant of a stellar explosion. Filaments glow with synchrotron radiation from the central pulsar.',
                        vi: 'Phần dư mở rộng của một vụ nổ sao. Các sợi phát sáng với bức xạ synchrotron từ xung quanh trung tâm.'
                    }
                },
                {
                    name: 'Pleiades',
                    type: 'Reflection Nebula',
                    id: 'pleiades',
                    radius: 22,
                    position: [0, 0, 0],
                    color: 0x87CEEB,
                    shader: nebulaDensityFragment,
                    info: {
                        en: 'Blue light scattered by dust surrounding hot young stars. Also known as the Seven Sisters.',
                        vi: 'Ánh sáng xanh bị tán xạ bởi bụi xung quanh các ngôi sao trẻ nóng. Còn được gọi là Bảy chị em.'
                    }
                }
            ]
        };

        const allEntities = [...entities.moons, ...entities.smallBodies, ...entities.nebulae];
        const entityMap = {};

        allEntities.forEach(entity => {
            entityMap[entity.id] = entity;
        });

        // ============================================================
        // CREATE 3D OBJECTS
        // ============================================================
        const objects = {};

        function createObject(entity) {
            let geometry, material;

            if (entity.type === 'Irregular Captured Moon' || entity.type === 'C-Type Asteroid' || entity.id === 'oumuamua') {
                // Irregular shapes
                geometry = new THREE.IcosahedronGeometry(entity.radius, 4);
                if (entity.id === 'oumuamua') {
                    geometry.scale(3, 0.5, 0.5);
                }
            } else if (entity.type === 'Dark Nebula') {
                geometry = new THREE.IcosahedronGeometry(entity.radius, 5);
            } else {
                geometry = new THREE.IcosahedronGeometry(entity.radius, 32);
            }

            material = createShaderMaterial(entity.shader);

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(...entity.position);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = entity;

            return mesh;
        }

        // Create all objects
        allEntities.forEach(entity => {
            const mesh = createObject(entity);
            scene.add(mesh);
            objects[entity.id] = mesh;
        });

        // ============================================================
        // UI AND INTERACTIONS
        // ============================================================
        let currentTab = 'moons';
        let selectedEntity = null;
        let autoRotate = false;

        function updateEntityList() {
            const list = document.getElementById('entity-list');
            list.innerHTML = '';

            const tabEntities = entities[currentTab];
            tabEntities.forEach(entity => {
                const item = document.createElement('div');
                item.className = 'entity-item' + (selectedEntity?.id === entity.id ? ' active' : '');
                item.innerHTML = `<div class="entity-name">${entity.name}</div><div class="entity-type">${entity.type}</div>`;
                item.onclick = () => selectEntity(entity);
                list.appendChild(item);
            });
        }

        function selectEntity(entity) {
            selectedEntity = entity;

            // Update UI
            document.querySelectorAll('.entity-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Update info panel
            document.getElementById('info-title').textContent = entity.name;
            document.getElementById('info-content').innerHTML = `
                <div class="info-section">
                    <div class="info-label">Type</div>
                    <div class="info-text">${entity.type}</div>
                </div>
                <div class="divider"></div>
                <div class="info-section">
                    <div class="info-label">Description (English)</div>
                    <div class="info-text">${entity.info.en}</div>
                </div>
                <div class="divider"></div>
                <div class="info-section">
                    <div class="info-label">Mô tả (Tiếng Việt)</div>
                    <div class="info-text">${entity.info.vi}</div>
                </div>
            `;

            // Fly camera to object
            flyToObject(objects[entity.id]);
        }

        function flyToObject(target) {
            const startPos = camera.position.clone();
            const targetPos = target.position.clone().normalize().multiplyScalar(target.geometry.boundingSphere.radius * 4);

            let progress = 0;
            const duration = 1.5; // seconds
            const startTime = Date.now();

            function animate() {
                progress = (Date.now() - startTime) / (duration * 1000);
                if (progress < 1) {
                    camera.position.lerpVectors(startPos, targetPos, easeInOutCubic(progress));
                    camera.lookAt(target.position);
                    requestAnimationFrame(animate);
                }
            }

            animate();
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function resetCamera() {
            camera.position.set(0, 0, 80);
            camera.lookAt(0, 0, 0);
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                updateEntityList();
            };
        });

        updateEntityList();

        // ============================================================
        // ANIMATION LOOP
        // ============================================================
        const clock = new THREE.Clock();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(Object.values(objects));

            if (intersects.length > 0) {
                const entity = intersects[0].object.userData;
                selectEntity(entity);
            }
        });

        // Mouse controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                const rotationSpeed = 0.005;
                const quaternion = new THREE.Quaternion();

                quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), deltaX * rotationSpeed);
                camera.position.applyQuaternion(quaternion);

                quaternion.setFromAxisAngle(camera.position.clone().cross(new THREE.Vector3(0, 1, 0)).normalize(), deltaY * rotationSpeed);
                camera.position.applyQuaternion(quaternion);

                camera.lookAt(0, 0, 0);
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const direction = camera.position.clone().normalize();
            const distance = camera.position.length();
            const newDistance = Math.max(20, Math.min(200, distance + e.deltaY * 0.1));
            camera.position.copy(direction.multiplyScalar(newDistance));
        });

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // Update shader uniforms
            Object.values(objects).forEach(mesh => {
                if (mesh.material.uniforms && mesh.material.uniforms.uTime) {
                    mesh.material.uniforms.uTime.value = elapsed;
                }

                // Auto rotate moons/bodies
                if (mesh.userData.type !== 'Dark Nebula') {
                    mesh.rotation.y += 0.001;
                    if (mesh.userData.type === 'Irregular Captured Moon' || mesh.userData.type === 'Interstellar Object') {
                        mesh.rotation.x += 0.0015;
                        mesh.rotation.z += 0.001;
                    }
                }
            });

            if (autoRotate) {
                const quaternion = new THREE.Quaternion();
                quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.001);
                camera.position.applyQuaternion(quaternion);
                camera.lookAt(0, 0, 0);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Hide loading
        document.getElementById('loading').style.display = 'none';

        animate();
    </script>
</body>
</html>
