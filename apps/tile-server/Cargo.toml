[package]
name = "cosmos-tile-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "cosmos-tile-server"
path = "src/main.rs"

[lib]
name = "cosmos_tile_server"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "signal", "macros", "fs", "io-util"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["compression-br", "trace", "cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
http = "1"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
