[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-etl"
version = "0.1.0"
description = "Cosmos Explorer catalog ingestion pipeline (T38)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["cosmos_etl*"]
exclude = ["tests*", "dags*", "migrations*", "elasticsearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
